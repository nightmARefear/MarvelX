plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

// Load keystore credentials.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace 'com.alexgreece45.marvelx'
    compileSdk 34

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
        }
    }

    defaultConfig {
        applicationId "com.alexgreece45.marvelx"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true

            resValue "string", "app_name", "MarvelX"
            buildConfigField "boolean", "LOG_MODE", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false

            resValue "string", "app_name", "MarvelX Debug"
            buildConfigField "boolean", "LOG_MODE", "true"
            versionNameSuffix "-DEBUG"
//            signingConfig signingConfigs.debug // If uncommented, the respective .apk files are generated.
        }

        mock {
            applicationIdSuffix ".mock"
            debuggable true
            minifyEnabled false

            resValue "string", "app_name", "MarvelX Mock"
            buildConfigField "boolean", "LOG_MODE", "true"
            versionNameSuffix "-MOCK"
//            signingConfig signingConfigs.debug // If uncommented, the respective .apk files are generated.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    kapt {
        correctErrorTypes true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.appcompat:appcompat:1.6.1"

    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.material:material:$compose_ui_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.30.1"
    implementation "com.google.accompanist:accompanist-placeholder:0.30.1"
    implementation("androidx.lifecycle:lifecycle-runtime-compose:$compose_ui_version")

    // Extra icons
    implementation "androidx.compose.material:material-icons-extended"

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Chucker
    def chuckerVersion = "4.0.0"
    debugImplementation "com.github.chuckerteam.chucker:library:$chuckerVersion"
    releaseImplementation "com.github.chuckerteam.chucker:library-no-op:$chuckerVersion"

    // Dagger - Hilt
    def dagger_version = "2.48"
    implementation "androidx.hilt:hilt-work:1.1.0"
    implementation "com.google.dagger:hilt-android:$dagger_version"
    kapt "com.google.dagger:hilt-compiler:$dagger_version"
    ksp "androidx.hilt:hilt-compiler:1.1.0"
    testImplementation "com.google.dagger:hilt-android-testing:$dagger_version"
    kaptTest "com.google.dagger:hilt-compiler:$dagger_version"

    // Logcat
    implementation 'com.squareup.logcat:logcat:0.1'

    // Coil
    implementation('io.coil-kt:coil-compose:2.4.0')

    // Navigation
    def nav_version = "2.7.3"

    implementation "androidx.navigation:navigation-compose:$nav_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.0.0"

    // Database
    def room_version = "2.5.2"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    ksp "androidx.room:room-compiler:$room_version"

    // optional - Test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    // optional - Paging 3 Integration
    implementation "androidx.room:room-paging:$room_version"

    // Security (i.e., storing data locally, password hashing).
    implementation "androidx.security:security-crypto:1.0.0"
    implementation "com.lambdapioneer.argon2kt:argon2kt:1.4.0"

    // Lottie.
    def lottie_version = "6.1.0"
    implementation "com.airbnb.android:lottie-compose:$lottie_version"

    // Leak canary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'

    // Work Manager - Kotlin + coroutines & Test helpers
    def work_version = "2.8.1"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    androidTestImplementation "androidx.work:work-testing:$work_version"
}